{% extends "layout.html" %}

{% block title %}
    Login
{% endblock %}

{% block main %}
    <h2 class="mb-4" >Enter your login information</h2>
    <form action='/login' method='post'>
        <div class='mb-3'>
            <input name='username' autofocus  class='form-control mx-auto w-auto' placeholder='Username' type='text'>
        </div class='mb-3'>
        <div class='mb-3'>
            <input name='password' class='form-control mx-auto w-auto' placeholder='Password' type='text'>
        </div>
        <button class="btn btn-secondary" type="submit">Login</button>
    </form>

{% endblock %}
