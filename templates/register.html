{% extends "layout.html" %}

{% block title %}
    Register
{% endblock %}

{% block main %}
    <h2 class="mb-4" >Register for an account</h2>
    <form action='/register' method='post'>
        <div class='mb-3'>
            <input name='username' autofocus  class='form-control mx-auto w-auto' placeholder='Username' type='text'>
        </div class='mb-3'>
        <div class='mb-3'>
            <input name='password' class='form-control mx-auto w-auto' placeholder='Password' type='text'>
        </div>
        <div class='mb-3'>
            <input name='confirmation' class='form-control mx-auto w-auto' placeholder='Confirm Password' type='text'>
        </div>
        <button class="btn btn-secondary" type="submit">Register</button>
    </form>

{% endblock %}
