{% extends "layout.html" %}

{% block title %}
    Homepage
{% endblock %}

{% block main %}
<!-- Custom inline styles injected safely inside your content block -->
<style>
    /* Dark Slate Page Background Override */
    body { 
        /* background-color: #121416 !important;  */
        color: #e3e6e8;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
    }
    /* Muted Dark Gray Feed Card Configuration */
    .feed-card { 
        background-color: #1d2023;
        border: 1px solid #2b3035; 
        border-radius: 12px; 
    }
    .team-badge-static {
        background-color: #2b3035;
        color: #9ca3af;
        font-size: 0.75rem;
        font-weight: 600;
        padding: 4px 8px;
        border-radius: 4px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        display: inline-block;
    }
    .text-muted-custom {
        color: #8a939e !important;
    }
</style>

<!-- Clean layout block wrapper matching your child view contents -->
<div class="container py-4">
    <h2 class="mb-4 text-white">My Teams</h2>
    <div class="row g-4">
        
        <!-- CENTRAL FEED COLUMN -->
        <div class="col-lg-7 mx-auto">
            
            <!-- SEGMENT 1: Live / Upcoming Score Card -->
            <div class="card feed-card mb-4">
                <div class="card-body p-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div class="d-flex align-items-center gap-2">
                            <span class="badge bg-secondary rounded-pill px-2 py-1 text-uppercase tracking-wider fw-bold" style="font-size: 0.65rem;">Upcoming</span>
                            <small class="text-muted-custom fw-semibold">Next Event</small>
                        </div>
                    </div>
                    
                    <!-- Team Rendering Row Matrix -->
                    <div class="d-flex flex-column gap-3">
                        {% for ele in teams_data %}
                            <div class="d-flex justify-content-between align-items-center">
                                <div class="d-flex align-items-center gap-3">
                                    <!-- Resolved logo string extraction path -->
                                    <img src="{{ ele.team.logos.0.href }}" 
                                         alt="{{ ele.team.displayName }} logo" 
                                         width="32" 
                                         height="32" 
                                         class="object-fit-contain img-fluid">
                                         
                                    <span class="fw-semibold text-white">{{ ele.team.displayName }}</span>
                                </div>
                            </div>
                        {% endfor %}
                    </div>
                </div>
                
                <!-- Static Non-Link Card Footer Info Element -->
                <div class="card-footer bg-transparent border-top-0 px-4 pb-3 pt-0">
                    <hr class="mt-0 mb-3 opacity-10" style="border-color: #2b3035;">
                    <div class="small text-muted-custom d-flex align-items-center gap-2">
                        <i class="fa-solid fa-circle-info opacity-50" style="font-size: 0.75rem;"></i>
                        <span>{{ game_details }}</span>
                    </div>
                </div>
            </div>

            <!-- SEGMENT 2: Modern Editorial News Card -->
