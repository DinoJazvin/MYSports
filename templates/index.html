{% extends "layout.html" %}

{% block title %}
    Homepage
{% endblock %}

{% block main %}
    <div class="container my-5">
        <h2 class="mb-4 text-center fw-bold">My Favorites</h2>
        
        <!-- Grid layout that works beautifully on both desktop and mobile screens -->
        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4 justify-content-center">
            
            {% for team in final_data %}
                <div class="col">
                    <!-- Bootstrap card with a shadow and standard styling -->
                    <div class="card h-100 shadow-sm border-0 bg-light text-center py-4">
                        
                        <!-- Team Logo Container -->
                        <div class="d-flex justify-content-center mb-3">
                            <img src="{{ team.logo }}" 
                                 alt="{{ team.name }} Logo" 
                                 class="img-fluid" 
                                 style="max-height: 120px; object-fit: contain;">
                        </div>
                        
                        <!-- Card Body for Details -->
                        <div class="card-body p-2">
                            <h4 class="card-title fw-bold text-dark mb-2">{{ team.name }}</h4>
                            <p class="card-text text-muted mb-0 fs-5">
                                Record: <span class="badge bg-secondary px-3 py-2 fs-6 rounded-pill">{{ team.record }}</span>
                            </p>
                        </div>
                        
                    </div>
                </div>
            {% else %}
                <!-- Fallback view if the final_data list happens to be empty -->
                <div class="col-12 text-center py-5">
                    <p class="text-muted fs-5">You haven't added any favorite teams to your feed yet!</p>
                </div>
            {% endfor %}
            
        </div>
    </div>
{% endblock %}
